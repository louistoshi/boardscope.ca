<!DOCTYPE html>
<html>
<head><title>Generate Icon</title></head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
// Dark background
ctx.fillStyle = '#0d0f12';
ctx.fillRect(0, 0, 512, 512);
// Circuit board pattern
ctx.strokeStyle = '#00d9a6';
ctx.lineWidth = 4;
for (let i = 0; i < 8; i++) {
  for (let j = 0; j < 8; j++) {
    const x = 32 + i * 64;
    const y = 32 + j * 64;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.stroke();
    if (i < 7) { ctx.beginPath(); ctx.moveTo(x + 8, y); ctx.lineTo(x + 56, y); ctx.stroke(); }
    if (j < 7) { ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(x, y + 56); ctx.stroke(); }
  }
}
// BS text
ctx.fillStyle = '#00d9a6';
ctx.font = 'bold 120px monospace';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('BS', 256, 256);
// Download
const link = document.createElement('a');
link.download = 'icon.png';
link.href = c.toDataURL('image/png');
link.click();
</script>
<p>Right-click the canvas and save as icon.png</p>
</body>
</html>
