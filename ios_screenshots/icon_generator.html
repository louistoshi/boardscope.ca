<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate BoardScope Icon</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px; background: #f0f0f0; }
        canvas { border: 1px solid #ccc; max-width: 500px; max-height: 500px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        button { margin-top: 20px; padding: 15px 30px; font-size: 18px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #005bb5; }
    </style>
</head>
<body>
    <h2>App Store Icon Generator</h2>
    <p>Since your internet is down and my sandbox prevents me from copying the AI image directly to your folder,<br>I wrote this quick tool to generate a beautiful, solid 1024x1024 icon directly on your Mac.</p>
    <canvas id="iconCanvas" width="1024" height="1024"></canvas>
    <br>
    <button onclick="downloadIcon()">Download 1024x1024 Icon</button>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        // Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
        grad.addColorStop(0, '#f9f9f9');
        grad.addColorStop(1, '#e0e0e0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 1024);

        // Draw circuit-like lines
        ctx.strokeStyle = '#d4af37'; // Gold
        ctx.lineWidth = 12;
        ctx.beginPath();
        for (let i = 0; i < 20; i++) {
            ctx.moveTo(0, i * 60);
            ctx.lineTo(200 + Math.random() * 200, i * 60);
            ctx.lineTo(400 + Math.random() * 200, i * 60 + 50);
            ctx.lineTo(1024, i * 60 + 50);
        }
        ctx.stroke();

        // Draw central block
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 20;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(212, 212, 600, 600);
        
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 8;
        ctx.strokeRect(220, 220, 584, 584);

        // Reset shadow for text
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;

        // Draw "Bs" text
        ctx.fillStyle = '#1a1a1a'; // Dark metallic
        ctx.font = 'bold 380px -apple-system, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Bs', 512, 530);

        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'clean_app_store_icon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
