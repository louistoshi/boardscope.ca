name: Build Multi-Platform
on:
  push:
    tags:
      - 'v*'
      - '6.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: git config --global user.email "ci@boardscope.com" && git config --global user.name "BoardScope CI"
      - run: npm ci
      - run: npm run build:secure:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder hard-links duplicated npm packages and dies with
          # EEXIST; plain copies tolerate the collision
          USE_HARD_LINKS: 'false'
          GIT_ASKPASS: cmd /c exit
          GIT_TERMINAL_PROMPT: 0
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          repository: louistoshi/boardscope.ca
          tag_name: ${{ github.ref_name }}
          files: "dist/BoardScope Setup *.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: git config --global user.email "ci@boardscope.com" && git config --global user.name "BoardScope CI"
      - run: npm ci
      - run: npm run build:secure:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder hard-links duplicated npm packages and dies with
          # EEXIST; plain copies tolerate the collision
          USE_HARD_LINKS: 'false'
          GIT_ASKPASS: /bin/echo
          GIT_TERMINAL_PROMPT: 0
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          repository: louistoshi/boardscope.ca
          tag_name: ${{ github.ref_name }}
          files: |
            dist/BoardScope-*.dmg
            dist/BoardScope-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: git config --global user.email "ci@boardscope.com" && git config --global user.name "BoardScope CI"
      - run: npm ci
      - run: npm run build:secure:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder hard-links duplicated npm packages and dies with
          # EEXIST; plain copies tolerate the collision
          USE_HARD_LINKS: 'false'
          GIT_ASKPASS: /bin/echo
          GIT_TERMINAL_PROMPT: 0
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          repository: louistoshi/boardscope.ca
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
