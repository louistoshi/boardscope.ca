name: Build Multi-Platform
on:
  push:
    tags:
      - 'v*'
      - '6.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: git config --global user.email "ci@boardscope.com" && git config --global user.name "BoardScope CI"
      - run: npm ci
      - run: npm run build:secure:win
        env:
          # electron-builder hard-links duplicated npm packages and dies with
          # EEXIST; plain copies tolerate the collision
          USE_HARD_LINKS: 'false'
          GIT_ASKPASS: cmd /c exit
          GIT_TERMINAL_PROMPT: 0
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          repository: louistoshi/boardscope.ca
          tag_name: ${{ github.ref_name }}
          files: |
            dist/BoardScope Setup *.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-macos:
    # macos-26 (Darwin 25) breaks electron-builder 24.13.3 packaging with
    # "not a file"; macos-14 image retired 2026-11-02. macos-15 (Darwin 24)
    # is the newest runner generation electron-builder 24.x works with.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Validate notarytool credentials (fail fast with Apple's real error)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" > /dev/null && echo "notarytool credentials OK"
      - run: git config --global user.email "ci@boardscope.com" && git config --global user.name "BoardScope CI"
      - run: npm ci
      - run: npm run build:secure:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Developer ID Application cert (base64 p12) — electron-builder
          # imports it into a temp keychain and signs/notarizes automatically
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder hard-links duplicated npm packages and dies with
          # EEXIST; plain copies tolerate the collision
          USE_HARD_LINKS: 'false'
          GIT_ASKPASS: /bin/echo
          GIT_TERMINAL_PROMPT: 0
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          repository: louistoshi/boardscope.ca
          tag_name: ${{ github.ref_name }}
          files: |
            dist/BoardScope-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: git config --global user.email "ci@boardscope.com" && git config --global user.name "BoardScope CI"
      - run: npm ci
      - run: npm run build:secure:linux
        env:
          # electron-builder hard-links duplicated npm packages and dies with
          # EEXIST; plain copies tolerate the collision
          USE_HARD_LINKS: 'false'
          GIT_ASKPASS: /bin/echo
          GIT_TERMINAL_PROMPT: 0
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          repository: louistoshi/boardscope.ca
          tag_name: ${{ github.ref_name }}
          # deb is attached by the dedicated deb.yml workflow — uploading it
          # here too raced deb.yml's attach (404/422 on the same release)
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
